syncs:

  stage_in:

    source:
      filesystem: persistent_storage
      path: root_folder_test

    destination:
      filesystem: compute_storage
      path: test_folder_data_sync

    options:
      # Do not delay deletions during staging.
      #
      # Stale files already present on compute_storage are retained unless
      # deletion is explicitly enabled.
      delete_delay: false


  stage_out:

    source:
      filesystem: compute_storage
      path: test_folder_data_sync

    destination:
      filesystem: persistent_storage
      path: root_folder_test

    options:
      # Delay deletion of files until after transfers complete.
      #
      # This reduces the risk of persistent_storage being left partially
      # updated if a transfer fails midway. Enable only when this location
      # should behave as a mirror of compute_storage.
      #
      # For archival behaviour, leave deletion disabled so files removed from
      # compute_storage remain available on persistent_storage.
      delete_delay: false

      # Exclude transient working data that should not be persisted.
      additional_exclude_patterns:
        - "exploratory/"
        - "test_work_area/"
